services:
  max2tg:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      LOG_DIR: /app/logs
      STATE_DIR: /app/state
      HEALTH_HOST: 0.0.0.0
      HEALTH_PORT: 8080
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
